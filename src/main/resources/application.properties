spring.application.name=digitalshowcase
spring.profiles.active=dev
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.max-file-size=50MB
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.web.resources.static-locations=file:media/
spring.jackson.time-zone=America/Sao_Paulo


api.token.secret=${JWT_SECRET:my-secret-key}
media.image.directory=${MEDIA_IMAGE_DIR:media/images}
media.image.preview.directory=${MEDIA_IMAGE_PREVIEW_DIR:media/images/preview}
media.video.directory=${MEDIA_VIDEO_DIR:media/video}
media.video.preview.directory=${MEDIA_VIDEO_PREVIEW_DIR:media/video/preview}


